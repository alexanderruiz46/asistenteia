name: Deploy to Firebase

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm --prefix functions ci || npm --prefix functions install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "Intento de despliegue $i de 3..."
            if firebase deploy --only hosting,functions --token "$FIREBASE_TOKEN" --non-interactive --force; then
              echo "Despliegue exitoso en el intento $i"
              exit 0
            fi
            ERROR_MESSAGE=$(firebase deploy --only hosting,functions --token "$FIREBASE_TOKEN" --non-interactive --force 2>&1 || true)
            if [[ "$ERROR_MESSAGE" == *"Quota exceeded"* ]]; then
              echo "Error de cuota. Esperando 120 segundos..."
              sleep 120
            else
              echo "$ERROR_MESSAGE"
              exit 1
            fi
          done
          echo "Todos los intentos de despliegue fallaron"
          exit 1
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Verify health (push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -eu
          for i in 1 2 3 4 5; do
            echo "Verificando API (intento $i)..."
            API_RESPONSE=$(curl -sS https://us-central1-asistenteia-185c4.cloudfunctions.net/api/health || true)
            if [[ "$API_RESPONSE" == *"status"* ]]; then
              echo "API OK: $API_RESPONSE"
              break
            fi
            sleep 15
            if [[ $i -eq 5 ]]; then
              echo "API no responde correctamente"
              exit 1
            fi
          done
          HOSTING_RESPONSE=$(curl -sS -L https://asistenteia-185c4.web.app || true)
          if echo "$HOSTING_RESPONSE" | grep -qi '<!DOCTYPE html>'; then
            echo "Hosting OK"
          else
            echo "Hosting no responde correctamente"
            echo "$HOSTING_RESPONSE" | head -c 300
            exit 1
          fi

      - name: Check Logs
        if: failure() && github.event_name == 'push'
        run: firebase functions:log --token "$FIREBASE_TOKEN" || true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
